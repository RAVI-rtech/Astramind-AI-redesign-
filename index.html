    <script>
      // Restore clean SPA URL on GitHub Pages when redirected from 404.html (?p=/subroute)
      (function () {
        try {
          var search = window.location.search;
          if (search && search.indexOf("p=") !== -1) {
            var params = new URLSearchParams(search);
            var route = params.get("p");
            if (route) {
              params.delete("p");
              var cleanRoute = route.charAt(0) === "/" ? route : "/" + route;
              var base = "/Astramind-Ai";
              var targetPath = cleanRoute.toLowerCase().indexOf(base.toLowerCase()) === 0
                ? cleanRoute
                : base + (cleanRoute === "/" ? "/" : cleanRoute);
              var remainingQuery = params.toString();
              var nextUrl = targetPath + (remainingQuery ? "?" + remainingQuery : "") + window.location.hash;
              window.history.replaceState(null, "", nextUrl);
            }
          }
        } catch (e) {}
      })();
    </script>
